<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StartCam - Streamer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: white;
            text-align: center;
        }
        
        #localVideo {
            width: 100%;
            max-width: 640px;
            height: auto;
            border: 2px solid #333;
            border-radius: 8px;
            background: black;
        }
        
        button {
            padding: 12px 24px;
            margin: 10px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #007bff;
            color: white;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #0056b3;
        }
        
        button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        
        .status {
            margin: 20px 0;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
        }
        
        .status.connected {
            background: #d4edda;
            color: #155724;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .volume-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 10px 0;
            color: white;
        }
        
        .volume-slider {
            width: 150px;
            height: 6px;
            background: #333;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #007bff;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .volume-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: #007bff;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>
    <h1>📱 StartCam Streamer</h1>
    <div id="status" class="status info">Ready to start streaming</div>
    
    <video id="localVideo" autoplay muted playsinline></video>
    <audio id="remoteAudio" autoplay playsinline webkit-playsinline controls volume="1.0"></audio>
    
    <div>
        <button id="startBtn" onclick="startStream()">Start Camera</button>
        <button id="stopCameraBtn" onclick="stopCamera()" disabled style="background: #dc3545;">📷 Stop Camera</button>
        <button id="switchCameraBtn" onclick="switchCamera()" disabled style="display: none;">Switch Camera</button>
        <button id="muteBtn" onclick="toggleMute()" disabled>🎤 Mute</button>
        <button id="stopWebRTCBtn" onclick="stopWebRTC()" disabled style="background: #dc3545;">🔌 Stop WebRTC</button>
        <div class="volume-control" id="volumeControl" style="display: none;">
            <span>🔊</span>
            <input type="range" id="volumeSlider" class="volume-slider" min="0" max="200" value="100" oninput="adjustVolume(this.value)">
            <span id="volumeValue">100%</span>
        </div>
        <button id="remoteAudioBtn" onclick="toggleRemoteAudio()" disabled style="display: none;">🔇 Remote Mute</button>
        <button id="forceAudioRoutingBtn" onclick="forceAudioRouting()" disabled style="display: none; background: #28a745;">🎧 Route to AirPods</button>
        <button id="connectBtn" onclick="connectToPeer()" disabled>Connect to Viewer</button>
    </div>

    <script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>
    <script>
        let localStream = null;
        let processedStream = null; // Stream with audio processing applied
        let audioContext = null;
        let gainNode = null;
        let peer = null;
        let ws = null;
        let currentCamera = 'environment'; // 'user' for front, 'environment' for rear (default to back camera)
        let availableCameras = [];
        let isMuted = false;
        let currentVolume = 100; // 0-200%
        let globalAudioContext = null;
        let globalAudioSource = null;
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
        const isIOSChrome = isIOS && /CriOS/i.test(navigator.userAgent);
        
        const localVideo = document.getElementById('localVideo');
        const status = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const switchCameraBtn = document.getElementById('switchCameraBtn');
        const muteBtn = document.getElementById('muteBtn');
        const connectBtn = document.getElementById('connectBtn');
        const stopCameraBtn = document.getElementById('stopCameraBtn');
        const stopWebRTCBtn = document.getElementById('stopWebRTCBtn');
        const volumeControl = document.getElementById('volumeControl');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeValue = document.getElementById('volumeValue');
        const remoteAudio = document.getElementById('remoteAudio');
        const remoteAudioBtn = document.getElementById('remoteAudioBtn');
        const forceAudioRoutingBtn = document.getElementById('forceAudioRoutingBtn');
        
        function updateStatus(message, type = 'info') {
            status.textContent = message;
            status.className = `status ${type}`;
            console.log(`📱 [STREAMER] ${message}`);
        }
        
        // Add debug messages to page
        function addDebugMessage(message) {
            const debugDiv = document.getElementById('debug') || createDebugDiv();
            const timestamp = new Date().toLocaleTimeString();
            debugDiv.innerHTML += `<div>[${timestamp}] ${message}</div>`;
            debugDiv.scrollTop = debugDiv.scrollHeight;
            console.log(`🔍 [STREAMER DEBUG] ${message}`);
        }
        
        function createDebugDiv() {
            const debugDiv = document.createElement('div');
            debugDiv.id = 'debug';
            debugDiv.style.cssText = `
                position: fixed;
                top: 10px;
                right: 10px;
                width: 300px;
                height: 200px;
                background: rgba(0,0,0,0.8);
                color: lime;
                font-family: monospace;
                font-size: 10px;
                padding: 10px;
                border-radius: 5px;
                overflow-y: auto;
                z-index: 1000;
            `;
            document.body.appendChild(debugDiv);
            return debugDiv;
        }
        
        // Check available cameras
        async function detectCameras() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                availableCameras = devices.filter(device => device.kind === 'videoinput');
                console.log('📱 [STREAMER] Available cameras:', availableCameras.length);
                
                // Show switch button if multiple cameras available or on mobile
                const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
                if (availableCameras.length > 1 || isMobile) {
                    switchCameraBtn.style.display = 'inline-block';
                    console.log('📱 [STREAMER] Camera switching enabled');
                }
            } catch (error) {
                console.error('❌ [STREAMER] Error detecting cameras:', error);
            }
        }
        
        async function startStream() {
            try {
                updateStatus('Requesting camera access...', 'info');
                console.log('🎥 [STREAMER] Requesting getUserMedia...');
                
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        frameRate: { ideal: 30 },
                        facingMode: currentCamera
                    },
                    audio: true
                });
                
                console.log('🎥 [STREAMER] Got media stream:', localStream);
                console.log('🎥 [STREAMER] Video tracks:', localStream.getVideoTracks().length);
                console.log('🎥 [STREAMER] Audio tracks:', localStream.getAudioTracks().length);
                
                localStream.getTracks().forEach((track, index) => {
                    console.log(`📊 [STREAMER] Track ${index}:`, {
                        kind: track.kind,
                        enabled: track.enabled,
                        readyState: track.readyState,
                        label: track.label
                    });
                });
                
                // Initialize audio processing unless it conflicts with iOS Chrome Bluetooth routing
                setTimeout(() => {
                    if (isIOSChrome) {
                        console.log('🎧 [STREAMER] Skipping audio processing on iOS Chrome to keep AirPods routing');
                        processedStream = null;
                        return;
                    }

                    processedStream = initAudioProcessing();
                    
                    // Show volume control after audio processing is ready
                    if (processedStream && processedStream.getAudioTracks().length > 0) {
                        volumeControl.style.display = 'flex';
                        console.log('🔊 [STREAMER] Volume control enabled');
                    }
                }, 500);
                
                localVideo.srcObject = localStream;
                console.log('🎥 [STREAMER] Set video srcObject');
                
                // Wait for video to load
                localVideo.onloadedmetadata = () => {
                    console.log('🎥 [STREAMER] Local video metadata loaded:', {
                        videoWidth: localVideo.videoWidth,
                        videoHeight: localVideo.videoHeight,
                        duration: localVideo.duration
                    });
                    
                    // Check if OBS Virtual Camera is actually producing video
                    if (localVideo.videoWidth <= 2 || localVideo.videoHeight <= 2) {
                        console.warn('⚠️ [STREAMER] OBS Virtual Camera producing tiny video! Check OBS is running and camera is started.');
                    }
                    
                    // Verify tracks are producing data
                    localStream.getVideoTracks().forEach((track, index) => {
                        console.log(`🎬 [STREAMER] Video track ${index} settings:`, track.getSettings());
                        console.log(`📊 [STREAMER] Video track ${index} constraints:`, track.getConstraints());
                    });
                };
                
                startBtn.disabled = true;
                stopCameraBtn.disabled = false;
                switchCameraBtn.disabled = false;
                muteBtn.disabled = false;
                connectBtn.disabled = false;
                
                updateStatus('Camera started - Ready to connect', 'connected');
            } catch (err) {
                console.error('❌ [STREAMER] Error accessing camera:', err);
                updateStatus('Error accessing camera: ' + err.message, 'error');
            }
        }
        
        // Switch between front and rear camera
        async function switchCamera() {
            if (!localStream) return;
            
            try {
                console.log('📱 [STREAMER] Switching camera from:', currentCamera);
                
                // Toggle camera
                currentCamera = currentCamera === 'user' ? 'environment' : 'user';
                console.log('📱 [STREAMER] Switching to:', currentCamera);
                
                // Stop current stream
                localStream.getTracks().forEach(track => track.stop());
                
                // Request new stream with different camera
                updateStatus('Switching camera...', 'info');
                
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        frameRate: { ideal: 30 },
                        facingMode: currentCamera
                    },
                    audio: true
                });
                
                console.log('📱 [STREAMER] Camera switched successfully');
                
                // Reinitialize audio processing with new stream when supported
                if (isIOSChrome) {
                    console.log('🎧 [STREAMER] Skipping audio processing after camera switch on iOS Chrome');
                    processedStream = null;
                } else {
                    processedStream = initAudioProcessing();
                }
                
                localVideo.srcObject = localStream;
                
                // Restore mute state after camera switch
                if (isMuted) {
                    localStream.getAudioTracks().forEach(track => {
                        track.enabled = false;
                    });
                    // Also mute processed stream if it exists
                    if (processedStream) {
                        processedStream.getAudioTracks().forEach(track => {
                            track.enabled = false;
                        });
                    }
                    console.log('🎤 [STREAMER] Restored muted state after camera switch');
                }
                
                // If connected to peer, update the stream
                if (peer && !peer.destroyed) {
                    console.log('📱 [STREAMER] Updating peer stream after camera switch');
                    
                    const streamToUse = processedStream || localStream;
                    const senders = peer._pc.getSenders();
                    
                    for (const sender of senders) {
                        if (sender.track && sender.track.kind === 'video') {
                            await sender.replaceTrack(streamToUse.getVideoTracks()[0]);
                            console.log('📱 [STREAMER] Replaced video track in peer connection');
                        } else if (sender.track && sender.track.kind === 'audio') {
                            await sender.replaceTrack(streamToUse.getAudioTracks()[0]);
                            console.log('🎵 [STREAMER] Replaced audio track in peer connection');
                        }
                    }
                    
                    // Update stop WebRTC button state
                    stopWebRTCBtn.disabled = false;
                }
                
                updateStatus('Camera switched - Ready to connect', 'connected');
            } catch (err) {
                console.error('❌ [STREAMER] Error switching camera:', err);
                updateStatus('Camera switch failed: ' + err.message, 'error');
                
                // Try to restore previous camera
                currentCamera = currentCamera === 'user' ? 'environment' : 'user';
            }
        }
        
        // Stop camera stream
        function stopCamera() {
            try {
                updateStatus('Stopping camera...', 'info');
                
                // Stop all tracks in local stream
                if (localStream) {
                    localStream.getTracks().forEach(track => {
                        track.stop();
                        console.log(`📹 [STREAMER] Stopped ${track.kind} track`);
                    });
                    localStream = null;
                }
                
                // Stop processed stream
                if (processedStream) {
                    processedStream.getTracks().forEach(track => {
                        track.stop();
                    });
                    processedStream = null;
                }
                
                // Close audio context
                if (audioContext && audioContext.state !== 'closed') {
                    audioContext.close();
                    audioContext = null;
                    gainNode = null;
                }
                
                // Clear video display
                localVideo.srcObject = null;
                
                // Update button states
                startBtn.disabled = false;
                stopCameraBtn.disabled = true;
                switchCameraBtn.disabled = true;
                muteBtn.disabled = true;
                muteBtn.textContent = '🎤 Mute';
                muteBtn.style.backgroundColor = '#007bff';
                connectBtn.disabled = true;
                
                // Hide volume control
                volumeControl.style.display = 'none';
                
                // Reset mute state
                isMuted = false;
                
                updateStatus('Camera stopped', 'info');
                console.log('📹 [STREAMER] Camera stopped successfully');
                
            } catch (error) {
                console.error('❌ [STREAMER] Error stopping camera:', error);
                updateStatus('Error stopping camera: ' + error.message, 'error');
            }
        }
        
        // Stop WebRTC connection
        function stopWebRTC() {
            try {
                updateStatus('Stopping WebRTC connection...', 'info');
                
                // Destroy peer connection
                if (peer && !peer.destroyed) {
                    peer.destroy();
                    peer = null;
                    console.log('🔌 [STREAMER] Peer connection destroyed');
                }
                
                // Close WebSocket
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.close();
                    ws = null;
                    console.log('🔌 [STREAMER] WebSocket closed');
                }
                
                // Close global audio context
                if (globalAudioContext && globalAudioContext.state !== 'closed') {
                    globalAudioContext.close();
                    globalAudioContext = null;
                    globalAudioSource = null;
                }
                
                // Clear remote audio
                remoteAudio.srcObject = null;
                remoteAudio.pause();
                
                // Update button states
                connectBtn.disabled = localStream ? false : true; // Enable if camera is still running
                stopWebRTCBtn.disabled = true;
                
                // Hide remote controls
                remoteAudioBtn.style.display = 'none';
                remoteAudioBtn.disabled = true;
                forceAudioRoutingBtn.style.display = 'none';
                forceAudioRoutingBtn.disabled = true;
                
                // Reset remote audio button
                remoteAudioBtn.textContent = '🔇 Remote Mute';
                remoteAudioBtn.style.backgroundColor = '#007bff';
                
                updateStatus('WebRTC connection stopped', 'info');
                console.log('🔌 [STREAMER] WebRTC connection stopped successfully');
                
            } catch (error) {
                console.error('❌ [STREAMER] Error stopping WebRTC:', error);
                updateStatus('Error stopping WebRTC: ' + error.message, 'error');
            }
        }
        
        // Toggle audio mute
        function toggleMute() {
            if (!localStream) return;
            
            const streamToMute = processedStream || localStream;
            const audioTracks = streamToMute.getAudioTracks();
            if (audioTracks.length === 0) {
                console.warn('⚠️ [STREAMER] No audio tracks to mute');
                return;
            }
            
            isMuted = !isMuted;
            
            // Toggle all audio tracks (both original and processed)
            localStream.getAudioTracks().forEach(track => {
                track.enabled = !isMuted;
            });
            if (processedStream) {
                processedStream.getAudioTracks().forEach(track => {
                    track.enabled = !isMuted;
                });
            }
            
            // Update button text and visual feedback
            muteBtn.textContent = isMuted ? '🔇 Unmute' : '🎤 Mute';
            muteBtn.style.backgroundColor = isMuted ? '#dc3545' : '#007bff';
            
            // Update status
            const statusMsg = isMuted ? 'Microphone muted' : 'Microphone unmuted';
            console.log(`🎤 [STREAMER] ${statusMsg}`);
            updateStatus(statusMsg, isMuted ? 'error' : 'connected');
            
            // Show temporary status message
            setTimeout(() => {
                if (peer && !peer.destroyed) {
                    updateStatus('✅ Connected to viewer!', 'connected');
                } else {
                    updateStatus('Camera started - Ready to connect', 'connected');
                }
            }, 2000);
        }
        
        function connectToPeer() {
            addDebugMessage('🚀 connectToPeer() called');
            
            if (!localStream) {
                addDebugMessage('❌ No localStream');
                updateStatus('Start camera first', 'error');
                return;
            }
            
            // Use processed stream if available, otherwise fallback to original
            const streamToUse = processedStream || localStream;
            addDebugMessage(`🎵 Using ${processedStream ? 'processed' : 'original'} stream`);
            
            addDebugMessage('✅ localStream exists');
            
            // Prevent multiple connections
            if (peer && !peer.destroyed) {
                addDebugMessage('🔄 Destroying existing peer');
                peer.destroy();
            }
            if (ws && ws.readyState === WebSocket.OPEN) {
                addDebugMessage('🔄 Closing existing WebSocket');
                ws.close();
            }
            
            updateStatus('Connecting to signaling server...', 'info');
            addDebugMessage('📡 Creating WebSocket connection');
            
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}`;
            addDebugMessage(`🔗 WebSocket URL: ${wsUrl}`);
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                addDebugMessage('✅ WebSocket connected');
                updateStatus('Creating peer connection...', 'info');
                addDebugMessage('🔧 Creating SimplePeer');
                
                try {
                    peer = new SimplePeer({
                        initiator: true,
                        trickle: true, // Enable trickle to get signals
                        stream: processedStream || localStream,
                        config: {
                            // Add STUN to force server reflexive candidates with actual IPs
                            iceServers: [
                                { urls: 'stun:stun.l.google.com:19302' }
                            ],
                            iceTransportPolicy: 'all',
                            iceCandidatePoolSize: 10,
                            rtcpMuxPolicy: 'require',
                            bundlePolicy: 'max-bundle'
                        }
                    });
                    addDebugMessage('✅ SimplePeer created');
                } catch (error) {
                    addDebugMessage(`❌ SimplePeer failed: ${error.message}`);
                    updateStatus('Peer creation failed: ' + error.message, 'error');
                    return;
                }
                
                
                setupPeerEventHandlers();
                
                addDebugMessage('📡 Signal handler attached');
                
                // Force offer creation if not automatic
                setTimeout(() => {
                    addDebugMessage('⏰ Checking for offer after 2s');
                    if (peer && peer._pc && peer._pc.signalingState === 'stable') {
                        addDebugMessage('🔨 Forcing offer creation');
                        peer._pc.createOffer().then(offer => {
                            addDebugMessage('✅ Manual offer created');
                            return peer._pc.setLocalDescription(offer);
                        }).then(() => {
                            addDebugMessage('✅ Local description set');
                            addDebugMessage('⏳ Waiting for answer...');
                        }).catch(err => {
                            addDebugMessage(`❌ Manual offer failed: ${err.message}`);
                        });
                    } else {
                        addDebugMessage(`🔍 Peer state: ${peer._pc?.signalingState || 'unknown'}`);
                    }
                }, 2000);
            };
            
            // Define peer event handlers function
            function setupPeerEventHandlers() {
                peer.on('signal', (data) => {
                    addDebugMessage(`📤 Sending: ${data.type || 'unknown'}`);
                    
                    try {
                        ws.send(JSON.stringify({
                            type: 'signal',
                            data: data
                        }));
                        addDebugMessage(`✅ Signal sent: ${data.type}`);
                        
                        // Let natural ICE candidates be sent via onicecandidate handler
                    } catch (error) {
                        addDebugMessage(`❌ Signal failed: ${error.message}`);
                    }
                });
                
                addDebugMessage('📡 Signal handler attached');
                
                // Handle incoming stream from viewer
                peer.on('stream', (stream) => {
                    console.log('🎵 [STREAMER] Received audio stream from viewer!', stream);
                    addDebugMessage('🎵 Got viewer audio stream');
                    updateStatus('🎵 Received audio stream from viewer!', 'connected');
                    
                    // Enhanced audio stream debugging
                    console.log('🔊 [STREAMER] Audio stream details:', {
                        id: stream.id,
                        active: stream.active,
                        audioTracks: stream.getAudioTracks().length,
                        videoTracks: stream.getVideoTracks().length
                    });
                    
                    // Play viewer's audio with enhanced setup
                    remoteAudio.srcObject = stream;
                    remoteAudio.volume = 1.0; // Ensure full volume
                    remoteAudio.muted = false; // Ensure not muted
                    console.log('🔊 [STREAMER] Set remote audio source with volume=1.0, muted=false');
                    updateStatus('🔊 Set remote audio source', 'info');
                    
                    // Force audio play with user interaction
                    remoteAudio.play().then(() => {
                        console.log('🔊 [STREAMER] ✅ Remote audio playback started successfully');
                        updateStatus('🔊 ✅ Remote audio playing!', 'connected');
                    }).catch(error => {
                        console.error('🔊 [STREAMER] ❌ Remote audio playback failed:', error);
                        updateStatus('🔊 ❌ Audio blocked: ' + error.message, 'error');
                        
                        // Add click handler to enable audio on user interaction
                        document.addEventListener('click', () => {
                            remoteAudio.play().then(() => {
                                console.log('🔊 [STREAMER] ✅ Audio enabled after user click');
                                updateStatus('🔊 ✅ Audio enabled after click!', 'connected');
                            }).catch(err => {
                                console.error('🔊 [STREAMER] ❌ Audio still failed after click:', err);
                            });
                        }, { once: true });
                    });
                    
                    // iOS AirPods audio routing fix
                    if (isIOS) {
                        console.log('🎧 [STREAMER] iOS detected - applying AirPods audio routing fixes');
                        updateStatus('🎧 iOS detected - applying AirPods fixes', 'info');
                        
                        // Keep iOS detection message visible for 3 seconds
                        setTimeout(() => {
                            updateStatus('🎧 iOS AirPods setup in progress...', 'info');
                        }, 1000);
                        
                        // Set audio element properties for iOS AirPods routing
                        remoteAudio.setAttribute('playsinline', true);
                        remoteAudio.setAttribute('webkit-playsinline', true);
                        updateStatus('🎧 Audio element attributes set for iOS', 'info');
                        
                        // Force audio to route through default output (AirPods if connected)
                        remoteAudio.addEventListener('loadedmetadata', () => {
                            console.log('🎧 [STREAMER] Audio metadata loaded, attempting iOS audio routing');
                            updateStatus('🎧 Audio metadata loaded - setting up routing', 'info');
                            
                            if (isIOSChrome) {
                                updateStatus('🎧 Skipping Web Audio reroute on iOS Chrome to preserve Bluetooth output', 'info');
                            } else {
                                // Create Web Audio API context to force proper routing (helps Safari)
                                try {
                                    if (!globalAudioContext) {
                                        globalAudioContext = new (window.AudioContext || window.webkitAudioContext)();
                                        console.log('🎧 [STREAMER] Created global AudioContext for iOS');
                                    }
                                    
                                    if (!globalAudioSource) {
                                        globalAudioSource = globalAudioContext.createMediaElementSource(remoteAudio);
                                        globalAudioSource.connect(globalAudioContext.destination);
                                        console.log('🎧 [STREAMER] Created MediaElementSource for iOS');
                                    }
                                    
                                    console.log('🎧 [STREAMER] Web Audio API routing established for iOS');
                                    updateStatus('🎧 Web Audio API routing established', 'connected');
                                    
                                    // Resume audio context if suspended
                                    if (globalAudioContext.state === 'suspended') {
                                        updateStatus('🎧 AudioContext suspended - resuming...', 'info');
                                        globalAudioContext.resume().then(() => {
                                            console.log('🎧 [STREAMER] iOS AudioContext resumed');
                                            updateStatus('🎧 AudioContext resumed successfully', 'connected');
                                        }).catch(resumeError => {
                                            updateStatus('🎧 AudioContext resume failed: ' + resumeError.message, 'error');
                                        });
                                    } else {
                                        updateStatus('🎧 AudioContext state: ' + globalAudioContext.state, 'info');
                                    }
                                } catch (webAudioError) {
                                    console.warn('🎧 [STREAMER] Web Audio API setup failed:', webAudioError);
                                    updateStatus('🎧 Web Audio API failed: ' + webAudioError.message, 'error');
                                }
                            }
                            
                            // Try to play immediately to establish audio context
                            remoteAudio.play().then(() => {
                                console.log('🎧 [STREAMER] iOS audio started successfully');
                                updateStatus('🎧 iOS audio started - should route to AirPods', 'connected');
                            }).catch(err => {
                                console.warn('🎧 [STREAMER] iOS audio autoplay failed:', err);
                                updateStatus('🎧 iOS audio autoplay failed: ' + err.message, 'error');
                            });
                        });
                        
                        // Add additional iOS audio debugging
                        remoteAudio.addEventListener('play', () => {
                            updateStatus('🎧 Audio PLAY event fired', 'connected');
                        });
                        
                        remoteAudio.addEventListener('playing', () => {
                            updateStatus('🎧 Audio PLAYING event fired', 'connected');
                        });
                        
                        remoteAudio.addEventListener('error', (err) => {
                            updateStatus('🎧 Audio ERROR: ' + err.message, 'error');
                        });
                        
                        // Show iOS audio routing button
                        forceAudioRoutingBtn.style.display = 'inline-block';
                        forceAudioRoutingBtn.disabled = false;
                        updateStatus('🎧 iOS AirPods routing button available', 'info');
                    } else {
                        // Not iOS - log this for debugging
                        console.log('🎧 [STREAMER] Non-iOS device detected - standard audio routing');
                        updateStatus('🎧 Non-iOS device - standard audio routing', 'info');
                    }
                    
                    // Show remote audio control if audio tracks exist
                    if (stream.getAudioTracks().length > 0) {
                        remoteAudioBtn.style.display = 'inline-block';
                        remoteAudioBtn.disabled = false;
                        console.log('🔊 [STREAMER] Remote audio control enabled');
                    }
                    
                    // Log stream details
                    console.log('🎵 [STREAMER] Remote stream details:', {
                        id: stream.id,
                        audioTracks: stream.getAudioTracks().length,
                        videoTracks: stream.getVideoTracks().length,
                        active: stream.active
                    });
                    
                    stream.getTracks().forEach((track, index) => {
                        console.log(`🎵 [STREAMER] Remote track ${index}:`, {
                            kind: track.kind,
                            enabled: track.enabled,
                            readyState: track.readyState,
                            label: track.label
                        });
                    });
                });
                
                // Force offer creation if not automatic
                setTimeout(() => {
                    addDebugMessage('⏰ Checking for offer after 2s');
                    if (peer && peer._pc && peer._pc.signalingState === 'stable') {
                        addDebugMessage('🔨 Forcing offer creation');
                        peer._pc.createOffer().then(offer => {
                            addDebugMessage('✅ Manual offer created');
                            return peer._pc.setLocalDescription(offer);
                        }).then(() => {
                            addDebugMessage('✅ Local description set');
                            addDebugMessage('⏳ Waiting for answer...');
                        }).catch(err => {
                            addDebugMessage(`❌ Manual offer failed: ${err.message}`);
                        });
                    } else {
                        addDebugMessage(`🔍 Peer state: ${peer._pc?.signalingState || 'unknown'}`);
                    }
                }, 2000);
                
                // Add timeout to force signal if needed
                setTimeout(() => {
                    console.log('⏰ [STREAMER] 5 second timeout - checking peer state');
                    console.log('🔍 [STREAMER] Peer destroyed?', peer.destroyed);
                    console.log('🔍 [STREAMER] Peer initiator?', peer.initiator);
                    console.log('🔍 [STREAMER] ICE gathering state:', peer._pc.iceGatheringState);
                    console.log('🔍 [STREAMER] Signaling state:', peer._pc.signalingState);
                }, 5000);
                
                peer.on('connect', () => {
                    console.log('🤝 [STREAMER] Peer data channel connected!');
                    updateStatus('✅ Connected to viewer!', 'connected');
                    connectBtn.disabled = true;
                    stopWebRTCBtn.disabled = false;
                    
                    // Comprehensive WebRTC sender verification
                    const activeStream = processedStream || localStream;
                    console.log('🔍 [STREAMER] Verifying stream after connect:', {
                        streamId: activeStream?.id,
                        tracks: activeStream?.getTracks().length,
                        peerStreams: peer._pc.getLocalStreams ? peer._pc.getLocalStreams().length : 'N/A',
                        usingProcessedAudio: !!processedStream
                    });
                    
                    // Check WebRTC senders
                    const senders = peer._pc.getSenders();
                    console.log('📤 [STREAMER] WebRTC senders:', senders.length);
                    senders.forEach((sender, index) => {
                        console.log(`📺 [STREAMER] Sender ${index}:`, {
                            track: sender.track?.kind,
                            trackEnabled: sender.track?.enabled,
                            trackState: sender.track?.readyState,
                            trackLabel: sender.track?.label
                        });
                    });
                    
                    // Verify tracks are still live
                    activeStream.getTracks().forEach((track, index) => {
                        console.log(`🎬 [STREAMER] Active stream track ${index} status:`, {
                            kind: track.kind,
                            enabled: track.enabled,
                            readyState: track.readyState,
                            muted: track.muted
                        });
                    });
                });
                
                peer.on('error', (err) => {
                    console.error('Peer error:', err);
                    updateStatus('Connection error: ' + err.message, 'error');
                });
                
                // Comprehensive WebRTC debugging
                peer._pc.oniceconnectionstatechange = () => {
                    console.log(`🔗 [STREAMER] ICE connection state: ${peer._pc.iceConnectionState}`);
                    updateStatus(`ICE: ${peer._pc.iceConnectionState}`, 'info');
                    
                    if (peer._pc.iceConnectionState === 'connected') {
                        console.log(`✅ [STREAMER] ICE CONNECTED! Streaming to viewer.`);
                        updateStatus('✅ ICE Connected - Streaming!', 'connected');
                    } else if (peer._pc.iceConnectionState === 'completed') {
                        console.log(`✅ [STREAMER] ICE COMPLETED! Stream fully established.`);
                        updateStatus('✅ Stream established!', 'connected');
                    } else if (peer._pc.iceConnectionState === 'failed') {
                        console.log(`❌ [STREAMER] ICE FAILED! Cannot reach viewer.`);
                        updateStatus('❌ ICE failed - Cannot reach viewer', 'error');
                    } else if (peer._pc.iceConnectionState === 'checking') {
                        console.log(`🔄 [STREAMER] ICE CHECKING... Trying to connect to viewer.`);
                        updateStatus('🔄 Connecting to viewer...', 'info');
                    }
                    
                    // Check if we're connected but peer.on('connect') didn't fire
                    if (peer._pc.iceConnectionState === 'connected' || peer._pc.iceConnectionState === 'completed') {
                        console.log('✅ [STREAMER] ICE connected! Checking senders...');
                        
                        // Verify senders immediately when ICE connects
                        const senders = peer._pc.getSenders();
                        console.log('📤 [STREAMER] WebRTC senders at ICE connect:', senders.length);
                        senders.forEach((sender, index) => {
                            console.log(`📺 [STREAMER] Sender ${index}:`, {
                                track: sender.track?.kind,
                                trackEnabled: sender.track?.enabled,
                                trackState: sender.track?.readyState,
                                trackLabel: sender.track?.label?.substring(0, 20) + '...'
                            });
                        });
                        
                        // Check if tracks are still good
                        const currentActiveStream = processedStream || localStream;
                        console.log('🎬 [STREAMER] Active stream status at ICE connect:', {
                            active: currentActiveStream.active,
                            tracks: currentActiveStream.getTracks().length,
                            usingProcessedAudio: !!processedStream
                        });
                        currentActiveStream.getTracks().forEach((track, index) => {
                            console.log(`🎵 [STREAMER] Track ${index}:`, {
                                kind: track.kind,
                                enabled: track.enabled,
                                readyState: track.readyState,
                                muted: track.muted
                            });
                        });
                    }
                };
                
                peer._pc.onicegatheringstatechange = () => {
                    console.log(`📡 [STREAMER] ICE gathering state: ${peer._pc.iceGatheringState}`);
                    
                    // When gathering completes, start polling connection state
                    if (peer._pc.iceGatheringState === 'complete') {
                        console.log(`🔍 [STREAMER] Starting ICE state monitoring...`);
                        
                        const pollICEState = () => {
                            console.log(`📊 [STREAMER] Current states:`, {
                                iceConnection: peer._pc.iceConnectionState,
                                iceGathering: peer._pc.iceGatheringState,
                                connection: peer._pc.connectionState,
                                signalingState: peer._pc.signalingState
                            });
                        };
                        
                        // Poll every 2 seconds for 10 seconds to see what's happening
                        pollICEState(); // immediate
                        setTimeout(pollICEState, 2000);
                        setTimeout(pollICEState, 4000);
                        setTimeout(pollICEState, 6000);
                        setTimeout(pollICEState, 8000);
                        setTimeout(pollICEState, 10000);
                    }
                };
                
                peer._pc.onconnectionstatechange = () => {
                    console.log(`🔌 [STREAMER] Connection state: ${peer._pc.connectionState}`);
                };
                
                // Listen for track changes (important for audio track replacement)
                peer._pc.ontrack = (event) => {
                    console.log('🎵 [STREAMER] Track event received:', {
                        kind: event.track.kind,
                        readyState: event.track.readyState,
                        enabled: event.track.enabled,
                        label: event.track.label,
                        streams: event.streams.length
                    });
                    
                    if (event.track.kind === 'audio') {
                        console.log('🔊 [STREAMER] Audio track detected in ontrack event!');
                        
                        // Handle the audio track directly
                        if (event.streams && event.streams.length > 0) {
                            const stream = event.streams[0];
                            console.log('🔊 [STREAMER] Setting audio stream from ontrack event');
                            
                            // Set up the audio element with the stream
                            remoteAudio.srcObject = stream;
                            remoteAudio.volume = 1.0;
                            remoteAudio.muted = false;
                            
                            updateStatus('🔊 Audio track received via ontrack!', 'connected');
                            
                            // Try to play
                            remoteAudio.play().then(() => {
                                console.log('🔊 [STREAMER] ✅ Audio playing from track event!');
                                updateStatus('🔊 ✅ Audio playing from track!', 'connected');
                            }).catch(error => {
                                console.error('🔊 [STREAMER] ❌ Audio play failed from track:', error);
                                updateStatus('🔊 ❌ Click to enable audio', 'error');
                            });
                        }
                    }
                };
                
                let vpnCandidateSent = false;
                
                peer._pc.onicecandidate = (event) => {
                    if (event.candidate && !vpnCandidateSent) {
                        addDebugMessage(`🧊 Local candidate: ${event.candidate.address}:${event.candidate.port}`);
                        console.log(`🧊 [STREAMER] ICE candidate:`, event.candidate.address);
                        
                        // Send only one candidate with VPN IP
                        if (event.candidate.address && !event.candidate.address.endsWith('.local')) {
                            addDebugMessage(`🔧 Replacing ${event.candidate.address} with VPN IP 10.25.200.50`);
                            
                            // Create candidate with VPN IP but keep original port and other details
                            const vpnCandidate = event.candidate.candidate.replace(
                                event.candidate.address,
                                '10.25.200.50'
                            );
                            
                            try {
                                ws.send(JSON.stringify({
                                    type: 'signal',
                                    data: {
                                        type: 'candidate',
                                        candidate: {
                                            candidate: vpnCandidate,
                                            sdpMLineIndex: event.candidate.sdpMLineIndex,
                                            sdpMid: event.candidate.sdpMid
                                        }
                                    }
                                }));
                                addDebugMessage(`✅ Single VPN IP candidate sent: 10.25.200.50:${event.candidate.port}`);
                                vpnCandidateSent = true; // Only send one candidate
                            } catch (error) {
                                addDebugMessage(`❌ Failed to send VPN candidate: ${error.message}`);
                            }
                        } else if (event.candidate.address && event.candidate.address.endsWith('.local')) {
                            addDebugMessage(`🚫 Skipping .local candidate`);
                        }
                    } else if (event.candidate && vpnCandidateSent) {
                        addDebugMessage(`🚫 Ignoring additional candidate: ${event.candidate.address}`);
                    } else {
                        addDebugMessage('✅ ICE gathering complete');
                        console.log(`✅ [STREAMER] ICE gathering complete`);
                    }
                };
            }
            
            ws.onmessage = async (event) => {
                try {
                    let data = event.data;
                    
                    // Handle Blob data
                    if (data instanceof Blob) {
                        data = await data.text();
                    }
                    
                    const message = JSON.parse(data);
                    console.log(`📥 [STREAMER] Received message type:`, message.type);
                    console.log(`📥 [STREAMER] Full message:`, message);
                    
                    if (message.type === 'request_offer') {
                        console.log(`📋 [STREAMER] Viewer requesting offer, creating new peer connection...`);
                        
                        // Destroy existing peer if any
                        if (peer && !peer.destroyed) {
                            console.log(`🔄 [STREAMER] Destroying existing peer for new connection`);
                            peer.destroy();
                        }
                        
                        // Create new peer connection for the requesting viewer
                        try {
                            peer = new SimplePeer({
                                initiator: true,
                                trickle: true,
                                stream: processedStream || localStream,
                                config: {
                                    iceServers: [
                                        { urls: 'stun:stun.l.google.com:19302' }
                                    ],
                                    iceTransportPolicy: 'all',
                                    iceCandidatePoolSize: 10,
                                    rtcpMuxPolicy: 'require',
                                    bundlePolicy: 'max-bundle'
                                }
                            });
                            
                            // Set up all the peer event handlers (reusing existing code)
                            setupPeerEventHandlers();
                            
                            // Add timeout to force signal if needed (same as original connection)
                            setTimeout(() => {
                                console.log('⏰ [STREAMER] 5 second timeout - checking peer state for new connection');
                                if (peer && !peer.destroyed) {
                                    console.log('🔍 [STREAMER] Peer destroyed?', peer.destroyed);
                                    console.log('🔍 [STREAMER] Peer initiator?', peer.initiator);
                                    console.log('🔍 [STREAMER] ICE gathering state:', peer._pc.iceGatheringState);
                                    console.log('🔍 [STREAMER] Signaling state:', peer._pc.signalingState);
                                }
                            }, 5000);
                            
                        } catch (error) {
                            addDebugMessage(`❌ New peer creation failed: ${error.message}`);
                            console.error(`❌ [STREAMER] Failed to create new peer:`, error);
                        }
                    } else if (message.type === 'signal' && peer) {
                        console.log(`📋 [STREAMER] Signal data type:`, message.data?.type);
                        
                        if (message.data.type === 'answer') {
                            addDebugMessage('📋 Got answer from viewer');
                            console.log(`📋 [STREAMER] Got answer! SDP length:`, message.data.sdp?.length);
                            updateStatus('📋 Processing answer from viewer', 'info');
                        } else if (message.data.type === 'offer') {
                            // This is a renegotiation offer from the viewer
                            addDebugMessage('🔄 Got renegotiation offer');
                            console.log(`🔄 [STREAMER] Received renegotiation offer! SDP length:`, message.data.sdp?.length);
                            updateStatus('🔄 Processing renegotiation from viewer', 'info');
                            
                            // Check if this offer includes audio tracks that weren't there before
                            if (message.data.sdp && message.data.sdp.includes('m=audio')) {
                                console.log(`🎵 [STREAMER] Renegotiation includes audio tracks!`);
                                updateStatus('🎵 Viewer is adding audio stream', 'connected');
                            }
                        } else if (message.data.candidate) {
                            // Extract IP from candidate string
                            const candidateString = message.data.candidate.candidate || message.data.candidate;
                            const ipMatch = candidateString.match(/(\d+\.\d+\.\d+\.\d+)\s+(\d+)/);
                            if (ipMatch) {
                                addDebugMessage(`🎯 Remote candidate: ${ipMatch[1]}:${ipMatch[2]}`);
                            }
                            console.log(`🧊 [STREAMER] Got ICE candidate:`, message.data.candidate);
                        }
                        
                        peer.signal(message.data);
                        console.log(`✅ [STREAMER] Signal processed by peer`);
                    } else if (!peer) {
                        addDebugMessage('⚠️ No peer to handle signal');
                        console.log(`⚠️ [STREAMER] No peer object to handle signal`);
                    }
                } catch (error) {
                    console.error('❌ [STREAMER] Error parsing WebSocket message:', error);
                    console.error('❌ [STREAMER] Raw data:', event.data);
                }
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                updateStatus('Signaling server error', 'error');
            };
            
            ws.onclose = () => {
                updateStatus('Disconnected from signaling server', 'error');
            };
        }
        
        // Audio processing functions
        function initAudioProcessing() {
            if (!localStream) return null;
            
            try {
                // Create audio context if it doesn't exist (with user interaction check)
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    console.log('🎵 [STREAMER] Created AudioContext');
                    
                    // Resume audio context if suspended (required on mobile)
                    if (audioContext.state === 'suspended') {
                        audioContext.resume().then(() => {
                            console.log('🎵 [STREAMER] AudioContext resumed');
                        }).catch(err => {
                            console.warn('⚠️ [STREAMER] Failed to resume AudioContext:', err);
                        });
                    }
                }
                
                // Get audio tracks
                const audioTracks = localStream.getAudioTracks();
                if (audioTracks.length === 0) {
                    console.warn('⚠️ [STREAMER] No audio tracks found');
                    return localStream;
                }
                
                // Create audio processing chain
                const source = audioContext.createMediaStreamSource(localStream);
                gainNode = audioContext.createGain();
                const destination = audioContext.createMediaStreamDestination();
                
                // Connect: microphone → gainNode → destination
                source.connect(gainNode);
                gainNode.connect(destination);
                
                // Set initial volume (100% = 1.0)
                gainNode.gain.value = currentVolume / 100;
                
                // Create new stream with processed audio + original video
                const videoTracks = localStream.getVideoTracks();
                const newStream = new MediaStream();
                
                // Add video tracks from original stream
                videoTracks.forEach(track => newStream.addTrack(track));
                
                // Add processed audio tracks
                destination.stream.getAudioTracks().forEach(track => newStream.addTrack(track));
                
                console.log('🎵 [STREAMER] Audio processing initialized:', {
                    originalAudioTracks: audioTracks.length,
                    processedAudioTracks: destination.stream.getAudioTracks().length,
                    videoTracks: videoTracks.length,
                    totalNewTracks: newStream.getTracks().length
                });
                
                return newStream;
            } catch (error) {
                console.error('❌ [STREAMER] Audio processing failed:', error);
                return localStream; // Fallback to original stream
            }
        }
        
        function adjustVolume(value) {
            currentVolume = parseInt(value);
            volumeValue.textContent = currentVolume + '%';
            
            if (gainNode) {
                // Convert percentage to gain value (0-200% = 0.0-2.0)
                gainNode.gain.value = currentVolume / 100;
                console.log('🔊 [STREAMER] Volume adjusted to:', currentVolume + '%', 'gain:', gainNode.gain.value);
            }
        }
        
        // Toggle remote audio from viewer
        function toggleRemoteAudio() {
            if (!remoteAudio.srcObject) return;
            
            remoteAudio.muted = !remoteAudio.muted;
            
            // Update button text
            remoteAudioBtn.textContent = remoteAudio.muted ? '🔈 Unmute Remote' : '🔇 Remote Mute';
            remoteAudioBtn.style.backgroundColor = remoteAudio.muted ? '#dc3545' : '#007bff';
            
            console.log(`🔊 [STREAMER] Remote audio ${remoteAudio.muted ? 'muted' : 'unmuted'}`);
        }
        
        // Force iOS audio routing with user interaction
        async function forceAudioRouting() {
            updateStatus('🎧 User requested audio routing...', 'info');
            
            if (!remoteAudio.srcObject) {
                updateStatus('🎧 No audio stream available for routing', 'error');
                return;
            }
            
            try {
                // Check for iOS audio output devices
                if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
                    updateStatus('🎧 Checking available audio devices...', 'info');
                    
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    const audioOutputs = devices.filter(device => device.kind === 'audiooutput');
                    
                    updateStatus(`🎧 Found ${audioOutputs.length} audio output devices`, 'info');
                    
                    // Log available devices
                    audioOutputs.forEach((device, index) => {
                        console.log(`Audio device ${index}: ${device.label || 'Unknown'} (${device.deviceId})`);
                        if (device.label.toLowerCase().includes('airpods') || 
                            device.label.toLowerCase().includes('bluetooth')) {
                            updateStatus(`🎧 Found Bluetooth device: ${device.label}`, 'connected');
                        }
                    });
                    
                    // Try to set audio output device if supported
                    if (remoteAudio.setSinkId) {
                        const bluetoothDevice = audioOutputs.find(device => 
                            device.label.toLowerCase().includes('airpods') || 
                            device.label.toLowerCase().includes('bluetooth')
                        );
                        
                        if (bluetoothDevice) {
                            updateStatus(`🎧 Attempting to route to: ${bluetoothDevice.label}`, 'info');
                            await remoteAudio.setSinkId(bluetoothDevice.deviceId);
                            updateStatus('🎧 Audio output device set successfully!', 'connected');
                        } else {
                            updateStatus('🎧 No AirPods/Bluetooth device found in list', 'error');
                        }
                    } else {
                        updateStatus('🎧 setSinkId not supported - using fallback method', 'info');
                    }
                }
                
                // Fallback: Stop and restart audio with user interaction context
                remoteAudio.pause();
                updateStatus('🎧 Paused audio for re-routing', 'info');

                if (isIOSChrome) {
                    updateStatus('🎧 Skipping Web Audio reroute on iOS Chrome - rely on native Bluetooth routing', 'info');
                    remoteAudio.play().then(() => {
                        updateStatus('🎧 Audio playing - verify AirPods output', 'connected');
                    }).catch(err => {
                        updateStatus('🎧 Failed to restart audio: ' + err.message, 'error');
                    });
                    return;
                }

                // Reuse or create AudioContext with user interaction
                if (!globalAudioContext) {
                    globalAudioContext = new (window.AudioContext || window.webkitAudioContext)();
                    updateStatus('🎧 Created new AudioContext: ' + globalAudioContext.state, 'info');
                } else {
                    updateStatus('🎧 Reusing existing AudioContext: ' + globalAudioContext.state, 'info');
                }

                // Force resume AudioContext
                globalAudioContext.resume().then(() => {
                    updateStatus('🎧 AudioContext resumed with user interaction', 'connected');
                    
                    // Create routing with user gesture (only if not already created)
                    if (!globalAudioSource) {
                        globalAudioSource = globalAudioContext.createMediaElementSource(remoteAudio);
                        globalAudioSource.connect(globalAudioContext.destination);
                        updateStatus('🎧 Created Web Audio routing', 'connected');
                    } else {
                        updateStatus('🎧 Web Audio routing already exists', 'connected');
                    }
                    
                    // Add iOS-specific audio session configuration
                    if ('mediaSession' in navigator) {
                        navigator.mediaSession.metadata = new MediaMetadata({
                            title: 'StartCam Audio Stream',
                            artist: 'StartCam',
                            album: 'WebRTC Stream'
                        });
                        updateStatus('🎧 Set iOS media session metadata', 'info');
                    }
                    
                    // Restart playback
                    remoteAudio.play().then(() => {
                        updateStatus('🎧 Audio restarted - check AirPods now', 'connected');
                    }).catch(err => {
                        updateStatus('🎧 Failed to restart audio: ' + err.message, 'error');
                    });
                }).catch(err => {
                    updateStatus('🎧 AudioContext resume failed: ' + err.message, 'error');
                });
                
            } catch (error) {
                updateStatus('🎧 Force routing failed: ' + error.message, 'error');
            }
        }
        
        // Initialize camera detection on page load
        window.addEventListener('load', () => {
            detectCameras();
            
            // Show device detection immediately
            if (isIOS) {
                updateStatus('📱 iOS device detected - AirPods support enabled', 'info');
            } else {
                updateStatus('💻 Non-iOS device detected - standard audio', 'info');
            }
        });
        
        window.addEventListener('beforeunload', () => {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            if (processedStream) {
                processedStream.getTracks().forEach(track => track.stop());
            }
            if (audioContext && audioContext.state !== 'closed') {
                audioContext.close();
            }
            if (peer) {
                peer.destroy();
            }
            if (ws) {
                ws.close();
            }
        });
    </script>
